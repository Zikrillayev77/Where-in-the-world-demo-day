<!DOCTYPE html>
<html lang="uz" class="h-full">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body class="bg-slate-950 text-slate-100 min-h-full font-sans antialiased flex flex-col items-center gap-12 pb-12">

  <header id="navbar"
    class="fixed top-0 left-0 w-full z-[100] bg-slate-900/90 backdrop-blur-md border-b border-slate-800 shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">

      
      <a href="index.html" class="text-xl font-bold text-white">Where in the world?</a>

      
      <ul class="flex items-center gap-6 text-sm font-medium text-slate-300">
        <li><a href="#all-countries" class="hover:text-white transition">All Countries</a></li>
        <li><a href="#regions" class="hover:text-white transition">Regions</a></li>
        <li><a href="quiz.html" class="text-blue-400">Quiz</a></li>
      </ul>

   
      <div class="flex items-center gap-3">
       

     
        <button id="dark-mode-btn"

          Dark Mode
        </button>
      </div>
    </div>
  </header>

  
  <div class="pt-24 w-full flex flex-col items-center">
  
  </div>

 
  <main class="w-full max-w-4xl px-4 flex flex-col items-center">
    <div id="game-card"
      class="w-full bg-slate-900 border border-slate-800/80 rounded-2xl shadow-2xl p-6 sm:p-10 transition-all duration-300 transform hover:border-slate-700">

      <div id="game-root" class="min-h-[350px] flex flex-col items-center justify-center text-center">

          <div class="w-16 h-16 bg-slate-800 rounded-full"></div>
          <div class="h-4 w-32 bg-slate-800 rounded"></div>
        </div>
      </div>

    </div>

  <script src="quiz.js"></script>
